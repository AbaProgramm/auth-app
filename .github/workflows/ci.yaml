name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  IMAGE: ghcr.io/abaprogramm/auth-app
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest && python -m pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      # Сканер уязвимостей: ломаем сборку на HIGH/CRITICAL с готовым фиксом
      #- uses: aquasecurity/trivy-action@0.28.0
      #  with:
      #    image-ref: ${{ env.IMAGE }}:${{ github.sha }}
      #    severity: HIGH,CRITICAL
      #   ignore-unfixed: true
      #    exit-code: "1"
  bump-gitops:           # CI НЕ деплоит. Он только коммитит новый тег в gitops-репо; деплоит ArgoCD.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/k8s-gitops
          token: ${{ secrets.GITOPS_TOKEN }}     # fine-grained PAT, права только на этот репо
      - run: |
          cd apps/auth-app/overlays/prod
          kustomize edit set image auth-app=${{ env.IMAGE }}:${{ github.sha }}
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git commit -am "auth-app: ${{ github.sha }}" && git push
